aid: firebase
name: Firebase
description: >-
  Firebase is Google's app development platform — a backend-as-a-service (BaaS)
  suite for building, running, and growing web and mobile apps. It bundles
  managed backend products including Authentication, Cloud Firestore, Realtime
  Database, Cloud Storage, Cloud Functions, Hosting and App Hosting, Cloud
  Messaging (FCM), Remote Config, Crashlytics, Performance Monitoring, App
  Distribution, Test Lab, A/B Testing, App Check, Firebase AI Logic, and
  Extensions. Firebase exposes Google-hosted REST APIs (Management, Firestore,
  Realtime Database, FCM, Remote Config, Identity Toolkit) plus first-party
  client and Admin SDKs for Apple, Android, Web, Flutter, Unity, C++, Node.js,
  Python, Java, Go, and .NET, a cross-platform CLI (firebase-tools), a local
  Emulator Suite, and an official MCP server for agent-driven workflows.
